<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded box -->
  <rect width="128" height="128" rx="28" fill="url(#bg)" stroke="#374151" stroke-width="2" />

  <!-- Attention Grid Pattern -->
  <g opacity="0.85" transform="translate(24, 24)">
    <!-- Heatmap cells -->
    <rect x="0" y="0" width="16" height="16" rx="4" fill="#06b6d4" opacity="0.95" />
    <rect x="20" y="0" width="16" height="16" rx="4" fill="#6366f1" opacity="0.3" />
    <rect x="40" y="0" width="16" height="16" rx="4" fill="#3b82f6" opacity="0.15" />
    <rect x="60" y="0" width="16" height="16" rx="4" fill="#1e293b" opacity="0.4" />

    <rect x="0" y="20" width="16" height="16" rx="4" fill="#06b6d4" opacity="0.4" />
    <rect x="20" y="20" width="16" height="16" rx="4" fill="#8b5cf6" opacity="0.9" />
    <rect x="40" y="20" width="16" height="16" rx="4" fill="#6366f1" opacity="0.2" />
    <rect x="60" y="20" width="16" height="16" rx="4" fill="#1e293b" opacity="0.4" />

    <rect x="0" y="40" width="16" height="16" rx="4" fill="#3b82f6" opacity="0.2" />
    <rect x="20" y="40" width="16" height="16" rx="4" fill="#06b6d4" opacity="0.6" />
    <rect x="40" y="40" width="16" height="16" rx="4" fill="#ec4899" opacity="0.95" />
    <rect x="60" y="40" width="16" height="16" rx="4" fill="#6366f1" opacity="0.35" />

    <rect x="0" y="60" width="16" height="16" rx="4" fill="#06b6d4" opacity="0.15" />
    <rect x="20" y="60" width="16" height="16" rx="4" fill="#6366f1" opacity="0.5" />
    <rect x="40" y="60" width="16" height="16" rx="4" fill="#8b5cf6" opacity="0.75" />
    <rect x="60" y="60" width="16" height="16" rx="4" fill="#06b6d4" opacity="1.0" />

    <!-- Attention Arcs -->
    <path d="M 8 76 C 8 20, 68 20, 68 76" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)" />
    <path d="M 28 76 C 28 40, 48 40, 48 76" fill="none" stroke="#f472b6" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Central Badge: Q K V -->
  <g transform="translate(64, 108)">
    <rect x="-38" y="-12" width="76" height="20" rx="6" fill="#0f172a" stroke="#6366f1" stroke-width="1.5" />
    <text x="0" y="2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="10" fill="#38bdf8" text-anchor="middle" letter-spacing="2">Q · K · V</text>
  </g>
</svg>
