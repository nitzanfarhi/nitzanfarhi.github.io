<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#128C7E" />
      <stop offset="50%" stop-color="#25D366" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FEF3C7" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" filter="url(#shadow)" />

  <!-- Chat bubble silhouette -->
  <path d="M34 36 C34 29 40 24 50 24 L78 24 C88 24 94 29 94 36 L94 66 C94 73 88 78 78 78 L52 78 L38 90 L40 78 C35 78 34 73 34 66 Z" fill="url(#chipGrad)" opacity="0.95" filter="url(#shadow)"/>

  <!-- Neural node connections inside bubble -->
  <circle cx="50" cy="46" r="5" fill="#128C7E" />
  <circle cx="78" cy="46" r="5" fill="#128C7E" />
  <circle cx="64" cy="60" r="6" fill="#F59E0B" />

  <!-- Synapse links -->
  <line x1="50" y1="46" x2="64" y2="60" stroke="#128C7E" stroke-width="2.5" stroke-linecap="round" />
  <line x1="78" y1="46" x2="64" y2="60" stroke="#128C7E" stroke-width="2.5" stroke-linecap="round" />

  <!-- Sparkle star -->
  <path d="M86 30 L88 34 L92 36 L88 38 L86 42 L84 38 L80 36 L84 34 Z" fill="#F59E0B" />
</svg>
