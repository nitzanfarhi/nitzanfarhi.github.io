    <!-- Prevent all gesture, pinch, and double-tap zoom on Safari iOS, Android, and Desktop -->
    <script>
      (function() {
        // 1. Prevent Safari iOS gesture zoom (pinch/rotate)
        document.addEventListener('gesturestart', function(e) { e.preventDefault(); }, { passive: false });
        document.addEventListener('gesturechange', function(e) { e.preventDefault(); }, { passive: false });
        document.addEventListener('gestureend', function(e) { e.preventDefault(); }, { passive: false });

        // 2. Prevent multi-finger pinch-to-zoom on touch screens
        document.addEventListener('touchmove', function(e) {
          if (e.touches && e.touches.length > 1) {
            e.preventDefault();
          }
        }, { passive: false });

        // 3. Prevent double-tap to zoom on mobile devices
        var lastTouchEnd = 0;
        document.addEventListener('touchend', function(e) {
          var now = Date.now();
          if (now - lastTouchEnd <= 300) {
            e.preventDefault();
          }
          lastTouchEnd = now;
        }, false);

        // 4. Prevent Ctrl+Wheel / trackpad pinch zoom on desktop
        document.addEventListener('wheel', function(e) {
          if (e.ctrlKey) {
            e.preventDefault();
          }
        }, { passive: false });

        // 5. Prevent keyboard zoom shortcuts (Ctrl/Cmd + '+', '-', '0')
        document.addEventListener('keydown', function(e) {
          if ((e.ctrlKey || e.metaKey) && (e.key === '+' || e.key === '-' || e.key === '=' || e.key === '0')) {
            e.preventDefault();
          }
        });
      })();
    </script>
