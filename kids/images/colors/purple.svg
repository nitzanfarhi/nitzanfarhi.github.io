<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF5FF" />
      <stop offset="100%" stop-color="#F3E8FF" />
    </linearGradient>
    <radialGradient id="glow_purple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow_purple" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
    <filter id="softShadow_purple" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.12" />
    </filter>
    
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="96" fill="url(#bg_purple)" />
  <circle cx="256" cy="256" r="210" fill="url(#glow_purple)" />

    <g filter="url(#shadow_purple)">
      <path d="M 256 120 C 330 110, 390 160, 380 230 C 410 270, 390 340, 330 360 C 270 380, 230 390, 180 360 C 120 330, 110 270, 130 210 C 110 150, 180 120, 256 120 Z" 
            fill="#A855F7" 
            stroke="#7E22CE" 
            stroke-width="0" />
      <circle cx="120" cy="150" r="16" fill="#A855F7" />
      <circle cx="390" cy="150" r="18" fill="#A855F7" />
      <circle cx="380" cy="370" r="14" fill="#A855F7" />
      <ellipse cx="210" cy="180" rx="28" ry="14" fill="#FFFFFF" opacity="0.5" transform="rotate(-30 210 180)" />
      
  <!-- Cute Face -->
  <g transform="translate(256, 250) scale(1.1)">
    <!-- Blush -->
    <ellipse cx="-70" cy="10" rx="16" ry="9" fill="#FF8BA7" opacity="0.6" />
    <ellipse cx="70" cy="10" rx="16" ry="9" fill="#FF8BA7" opacity="0.6" />
    <!-- Left Eye -->
    <circle cx="-38" cy="-10" r="14" fill="#1E293B" />
    <circle cx="-42" cy="-15" r="5" fill="#FFFFFF" />
    <circle cx="-34" cy="-7" r="2.5" fill="#FFFFFF" />
    <!-- Right Eye -->
    <circle cx="38" cy="-10" r="14" fill="#1E293B" />
    <circle cx="34" cy="-15" r="5" fill="#FFFFFF" />
    <circle cx="42" cy="-7" r="2.5" fill="#FFFFFF" />
    <!-- Smile -->
    <path d="M -16 20 Q 0 35 16 20" fill="none" stroke="#1E293B" stroke-width="5" stroke-linecap="round" />
  </g>

    </g>
  </svg>