<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_scissors" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF" />
      <stop offset="100%" stop-color="#DBEAFE" />
    </linearGradient>
    <radialGradient id="glow_scissors" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow_scissors" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
    <filter id="softShadow_scissors" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.12" />
    </filter>
    
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="96" fill="url(#bg_scissors)" />
  <circle cx="256" cy="256" r="210" fill="url(#glow_scissors)" />

    <g filter="url(#shadow_scissors)">
      <polygon points="256,240 180,120 200,120 256,220" fill="#94A3B8" />
      <polygon points="256,240 332,120 312,120 256,220" fill="#CBD5E1" />
      <circle cx="200" cy="310" r="40" fill="none" stroke="#EF4444" stroke-width="16" />
      <circle cx="312" cy="310" r="40" fill="none" stroke="#EF4444" stroke-width="16" />
    </g>
  </svg>