<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_pizza" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF7ED" />
      <stop offset="100%" stop-color="#FFEDD5" />
    </linearGradient>
    <radialGradient id="glow_pizza" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow_pizza" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
    <filter id="softShadow_pizza" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.12" />
    </filter>
    
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="96" fill="url(#bg_pizza)" />
  <circle cx="256" cy="256" r="210" fill="url(#glow_pizza)" />

    <g filter="url(#shadow_pizza)">
      <!-- Slice Crust -->
      <path d="M 140 140 Q 256 100 372 140 L 256 380 Z" fill="#F59E0B" />
      <!-- Sauce & Cheese -->
      <path d="M 155 155 Q 256 125 357 155 L 256 360 Z" fill="#FDE047" />
      <!-- Pepperoni -->
      <circle cx="256" cy="210" r="20" fill="#DC2626" />
      <circle cx="220" cy="270" r="16" fill="#DC2626" />
      <circle cx="290" cy="280" r="16" fill="#DC2626" />
    </g>
  </svg>