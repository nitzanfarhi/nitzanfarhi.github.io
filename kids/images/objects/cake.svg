<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_cake" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF1F2" />
      <stop offset="100%" stop-color="#FFE4E6" />
    </linearGradient>
    <radialGradient id="glow_cake" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow_cake" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
    <filter id="softShadow_cake" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.12" />
    </filter>
    
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="96" fill="url(#bg_cake)" />
  <circle cx="256" cy="256" r="210" fill="url(#glow_cake)" />

    <g filter="url(#shadow_cake)">
      <!-- Candle & Flame -->
      <rect x="250" y="140" width="12" height="40" fill="#38BDF8" />
      <ellipse cx="256" cy="125" rx="8" ry="14" fill="#F59E0B" />
      <!-- Top Layer -->
      <rect x="180" y="180" width="152" height="60" rx="8" fill="#F472B6" />
      <!-- Bottom Layer -->
      <rect x="140" y="240" width="232" height="90" rx="12" fill="#FB7185" />
      <!-- Frosting drips -->
      <path d="M 140 240 Q 160 265 180 240 Q 200 265 220 240 Q 240 265 260 240 Q 280 265 300 240 Q 320 265 340 240 Q 360 265 372 240" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" />
    </g>
  </svg>