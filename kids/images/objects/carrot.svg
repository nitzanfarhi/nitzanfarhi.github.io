<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_carrot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF7ED" />
      <stop offset="100%" stop-color="#FFEDD5" />
    </linearGradient>
    <radialGradient id="glow_carrot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow_carrot" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
    <filter id="softShadow_carrot" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.12" />
    </filter>
    
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="96" fill="url(#bg_carrot)" />
  <circle cx="256" cy="256" r="210" fill="url(#glow_carrot)" />

    <g filter="url(#shadow_carrot)">
      <!-- Leaves -->
      <path d="M 256 170 L 230 90 M 256 170 L 256 80 M 256 170 L 282 90" stroke="#16A34A" stroke-width="8" stroke-linecap="round" />
      <!-- Body -->
      <polygon points="215,170 297,170 256,380" fill="#EA580C" />
      <!-- Ridges -->
      <line x1="230" y1="220" x2="260" y2="220" stroke="#C2410C" stroke-width="4" stroke-linecap="round" />
      <line x1="250" y1="260" x2="280" y2="260" stroke="#C2410C" stroke-width="4" stroke-linecap="round" />
    </g>
  </svg>