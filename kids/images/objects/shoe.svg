<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_shoe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF1F2" />
      <stop offset="100%" stop-color="#FFE4E6" />
    </linearGradient>
    <radialGradient id="glow_shoe" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow_shoe" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
    <filter id="softShadow_shoe" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.12" />
    </filter>
    
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="96" fill="url(#bg_shoe)" />
  <circle cx="256" cy="256" r="210" fill="url(#glow_shoe)" />

    <g filter="url(#shadow_shoe)">
      <!-- Sole -->
      <path d="M 120 310 Q 256 340 392 310 L 392 335 Q 256 360 120 335 Z" fill="#FFFFFF" />
      <!-- Shoe Upper -->
      <path d="M 130 310 L 160 210 Q 220 200 250 250 L 350 260 Q 390 280 390 310 Z" fill="#F43F5E" />
      <!-- Laces -->
      <line x1="210" y1="230" x2="235" y2="250" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />
      <line x1="225" y1="220" x2="250" y2="240" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />
    </g>
  </svg>