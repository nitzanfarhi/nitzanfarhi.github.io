<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_flower" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF1F2" />
      <stop offset="100%" stop-color="#FFE4E6" />
    </linearGradient>
    <radialGradient id="glow_flower" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow_flower" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
    <filter id="softShadow_flower" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.12" />
    </filter>
    
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="96" fill="url(#bg_flower)" />
  <circle cx="256" cy="256" r="210" fill="url(#glow_flower)" />

    <g filter="url(#shadow_flower)">
      <!-- Stem -->
      <path d="M 256 256 Q 240 330 256 370" fill="none" stroke="#16A34A" stroke-width="14" stroke-linecap="round" />
      <ellipse cx="280" cy="320" rx="25" ry="12" fill="#22C55E" transform="rotate(-30 280 320)" />
      <!-- Petals -->
      
        <circle cx="311" cy="220" r="36" fill="#F43F5E" />
      
        <circle cx="283.5" cy="267.6313972081441" r="36" fill="#F43F5E" />
      
        <circle cx="228.5" cy="267.6313972081441" r="36" fill="#F43F5E" />
      
        <circle cx="201" cy="220" r="36" fill="#F43F5E" />
      
        <circle cx="228.49999999999997" cy="172.3686027918559" r="36" fill="#F43F5E" />
      
        <circle cx="283.5" cy="172.3686027918559" r="36" fill="#F43F5E" />
      
      <!-- Center -->
      <circle cx="256" cy="220" r="38" fill="#FACC15" />
    </g>
  </svg>