<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_clock" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF7ED" />
      <stop offset="100%" stop-color="#FFEDD5" />
    </linearGradient>
    <radialGradient id="glow_clock" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow_clock" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
    <filter id="softShadow_clock" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.12" />
    </filter>
    
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="96" fill="url(#bg_clock)" />
  <circle cx="256" cy="256" r="210" fill="url(#glow_clock)" />

    <g filter="url(#shadow_clock)">
      <circle cx="256" cy="256" r="120" fill="#FB923C" /><circle cx="256" cy="256" r="100" fill="#FFFFFF" />
      <line x1="256" y1="256" x2="256" y2="195" stroke="#1E293B" stroke-width="8" stroke-linecap="round" />
      <line x1="256" y1="256" x2="305" y2="256" stroke="#EF4444" stroke-width="6" stroke-linecap="round" />
    </g>
  </svg>