<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_cookie" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="100%" stop-color="#FEF3C7" />
    </linearGradient>
    <radialGradient id="glow_cookie" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow_cookie" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
    <filter id="softShadow_cookie" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.12" />
    </filter>
    
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="96" fill="url(#bg_cookie)" />
  <circle cx="256" cy="256" r="210" fill="url(#glow_cookie)" />

    <g filter="url(#shadow_cookie)">
      <circle cx="256" cy="256" r="115" fill="#D97706" />
      <!-- Chocolate Chips -->
      <circle cx="210" cy="200" r="14" fill="#451A03" />
      <circle cx="290" cy="210" r="16" fill="#451A03" />
      <circle cx="240" cy="260" r="18" fill="#451A03" />
      <circle cx="190" cy="290" r="14" fill="#451A03" />
      <circle cx="300" cy="295" r="15" fill="#451A03" />
    </g>
  </svg>