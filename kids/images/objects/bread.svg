<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_bread" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="100%" stop-color="#FEF3C7" />
    </linearGradient>
    <radialGradient id="glow_bread" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow_bread" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
    <filter id="softShadow_bread" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.12" />
    </filter>
    
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="96" fill="url(#bg_bread)" />
  <circle cx="256" cy="256" r="210" fill="url(#glow_bread)" />

    <g filter="url(#shadow_bread)">
      <!-- Loaf -->
      <path d="M 140 280 L 140 220 C 140 160, 372 160, 372 220 L 372 280 Q 256 310 140 280 Z" fill="#D97706" />
      <!-- Slits -->
      <ellipse cx="200" cy="210" rx="10" ry="25" fill="#FEF3C7" transform="rotate(25 200 210)" />
      <ellipse cx="256" cy="205" rx="10" ry="25" fill="#FEF3C7" transform="rotate(25 256 205)" />
      <ellipse cx="312" cy="210" rx="10" ry="25" fill="#FEF3C7" transform="rotate(25 312 210)" />
    </g>
  </svg>