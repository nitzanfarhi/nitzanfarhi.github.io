<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_toothbrush" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0FDFA" />
      <stop offset="100%" stop-color="#CCFBF1" />
    </linearGradient>
    <radialGradient id="glow_toothbrush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow_toothbrush" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
    <filter id="softShadow_toothbrush" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.12" />
    </filter>
    
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="96" fill="url(#bg_toothbrush)" />
  <circle cx="256" cy="256" r="210" fill="url(#glow_toothbrush)" />

    <g filter="url(#shadow_toothbrush)" transform="rotate(35 256 256)">
      <rect x="236" y="110" width="40" height="35" rx="4" fill="#FFFFFF" />
      <rect x="244" y="145" width="24" height="220" rx="12" fill="#0D9488" />
    </g>
  </svg>