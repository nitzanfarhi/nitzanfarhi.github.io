<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_watch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF" />
      <stop offset="100%" stop-color="#DBEAFE" />
    </linearGradient>
    <radialGradient id="glow_watch" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow_watch" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
    <filter id="softShadow_watch" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.12" />
    </filter>
    
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="96" fill="url(#bg_watch)" />
  <circle cx="256" cy="256" r="210" fill="url(#glow_watch)" />

    <g filter="url(#shadow_watch)">
      <rect x="226" y="100" width="60" height="312" rx="16" fill="#1E293B" />
      <circle cx="256" cy="256" r="75" fill="#FFFFFF" stroke="#3B82F6" stroke-width="14" />
      <line x1="256" y1="256" x2="256" y2="210" stroke="#1E293B" stroke-width="6" stroke-linecap="round" />
      <line x1="256" y1="256" x2="285" y2="256" stroke="#EF4444" stroke-width="4" stroke-linecap="round" />
    </g>
  </svg>