<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_television" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <radialGradient id="glow_television" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow_television" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
    <filter id="softShadow_television" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.12" />
    </filter>
    
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="96" fill="url(#bg_television)" />
  <circle cx="256" cy="256" r="210" fill="url(#glow_television)" />

    <g filter="url(#shadow_television)">
      <line x1="200" y1="120" x2="256" y2="160" stroke="#64748B" stroke-width="8" />
      <line x1="312" y1="120" x2="256" y2="160" stroke="#64748B" stroke-width="8" />
      <rect x="130" y="160" width="252" height="170" rx="16" fill="#1E293B" />
      <rect x="145" y="175" width="222" height="140" rx="8" fill="#38BDF8" />
    </g>
  </svg>