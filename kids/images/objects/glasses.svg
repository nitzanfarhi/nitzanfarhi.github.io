<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_glasses" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEFCE8" />
      <stop offset="100%" stop-color="#FEF08A" />
    </linearGradient>
    <radialGradient id="glow_glasses" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow_glasses" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
    <filter id="softShadow_glasses" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.12" />
    </filter>
    
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="96" fill="url(#bg_glasses)" />
  <circle cx="256" cy="256" r="210" fill="url(#glow_glasses)" />

    <g filter="url(#shadow_glasses)">
      <circle cx="190" cy="256" r="55" fill="none" stroke="#EA580C" stroke-width="16" />
      <circle cx="322" cy="256" r="55" fill="none" stroke="#EA580C" stroke-width="16" />
      <line x1="245" y1="256" x2="267" y2="256" stroke="#EA580C" stroke-width="16" />
    </g>
  </svg>