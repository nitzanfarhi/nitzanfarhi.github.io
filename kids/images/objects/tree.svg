<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_tree" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECFDF5" />
      <stop offset="100%" stop-color="#D1FAE5" />
    </linearGradient>
    <radialGradient id="glow_tree" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow_tree" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
    <filter id="softShadow_tree" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.12" />
    </filter>
    
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="96" fill="url(#bg_tree)" />
  <circle cx="256" cy="256" r="210" fill="url(#glow_tree)" />

    <g filter="url(#shadow_tree)">
      <!-- Trunk -->
      <rect x="236" y="270" width="40" height="100" rx="8" fill="#78350F" />
      <!-- Foliage -->
      <circle cx="256" cy="200" r="85" fill="#16A34A" />
      <circle cx="200" cy="220" r="65" fill="#22C55E" />
      <circle cx="312" cy="220" r="65" fill="#22C55E" />
    </g>
  </svg>