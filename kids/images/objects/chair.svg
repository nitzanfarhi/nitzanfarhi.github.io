<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_chair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="100%" stop-color="#FEF3C7" />
    </linearGradient>
    <radialGradient id="glow_chair" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow_chair" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
    <filter id="softShadow_chair" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.12" />
    </filter>
    
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="96" fill="url(#bg_chair)" />
  <circle cx="256" cy="256" r="210" fill="url(#glow_chair)" />

    <g filter="url(#shadow_chair)">
      <rect x="175" y="130" width="162" height="120" rx="16" fill="#D97706" />
      <rect x="155" y="250" width="202" height="30" rx="10" fill="#B45309" />
      <rect x="175" y="280" width="18" height="110" rx="6" fill="#78350F" /><rect x="319" y="280" width="18" height="110" rx="6" fill="#78350F" />
    </g>
  </svg>