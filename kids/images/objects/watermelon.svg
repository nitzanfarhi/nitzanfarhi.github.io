<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_watermelon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECFDF5" />
      <stop offset="100%" stop-color="#D1FAE5" />
    </linearGradient>
    <radialGradient id="glow_watermelon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow_watermelon" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
    <filter id="softShadow_watermelon" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.12" />
    </filter>
    
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="96" fill="url(#bg_watermelon)" />
  <circle cx="256" cy="256" r="210" fill="url(#glow_watermelon)" />

    <g filter="url(#shadow_watermelon)">
      <!-- Rind -->
      <path d="M 120 220 C 140 370, 372 370, 392 220 Z" fill="#15803D" />
      <path d="M 135 220 C 150 350, 362 350, 377 220 Z" fill="#FFFFFF" />
      <!-- Red Flesh -->
      <path d="M 145 220 C 160 335, 352 335, 367 220 Z" fill="#EF4444" />
      <!-- Seeds -->
      <circle cx="210" cy="255" r="6" fill="#1E293B" />
      <circle cx="256" cy="285" r="6" fill="#1E293B" />
      <circle cx="302" cy="255" r="6" fill="#1E293B" />
    </g>
  </svg>