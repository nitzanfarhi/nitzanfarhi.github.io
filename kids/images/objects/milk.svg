<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_milk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF" />
      <stop offset="100%" stop-color="#DBEAFE" />
    </linearGradient>
    <radialGradient id="glow_milk" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow_milk" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
    <filter id="softShadow_milk" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.12" />
    </filter>
    
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="96" fill="url(#bg_milk)" />
  <circle cx="256" cy="256" r="210" fill="url(#glow_milk)" />

    <g filter="url(#shadow_milk)">
      <!-- Carton Top -->
      <polygon points="200,160 256,120 312,160" fill="#93C5FD" />
      <!-- Carton Body -->
      <rect x="200" y="160" width="112" height="190" rx="8" fill="#3B82F6" />
      <rect x="200" y="210" width="112" height="70" fill="#FFFFFF" />
      <!-- Label Text or Cow spot -->
      <ellipse cx="256" cy="245" rx="25" ry="16" fill="#3B82F6" />
    </g>
  </svg>