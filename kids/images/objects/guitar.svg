<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_guitar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="100%" stop-color="#FEF3C7" />
    </linearGradient>
    <radialGradient id="glow_guitar" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow_guitar" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
    <filter id="softShadow_guitar" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.12" />
    </filter>
    
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="96" fill="url(#bg_guitar)" />
  <circle cx="256" cy="256" r="210" fill="url(#glow_guitar)" />

    <g filter="url(#shadow_guitar)" transform="rotate(-30 256 256)">
      <rect x="248" y="90" width="16" height="150" fill="#B45309" />
      <circle cx="256" cy="270" r="45" fill="#D97706" /><circle cx="256" cy="330" r="60" fill="#D97706" />
      <circle cx="256" cy="290" r="20" fill="#1E293B" />
    </g>
  </svg>