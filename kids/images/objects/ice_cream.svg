<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_ice_cream" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF2F8" />
      <stop offset="100%" stop-color="#FCE7F3" />
    </linearGradient>
    <radialGradient id="glow_ice_cream" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow_ice_cream" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
    <filter id="softShadow_ice_cream" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.12" />
    </filter>
    
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="96" fill="url(#bg_ice_cream)" />
  <circle cx="256" cy="256" r="210" fill="url(#glow_ice_cream)" />

    <g filter="url(#shadow_ice_cream)">
      <!-- Cone -->
      <polygon points="190,240 322,240 256,380" fill="#D97706" />
      <!-- Cone Grid Lines -->
      <line x1="210" y1="260" x2="290" y2="340" stroke="#B45309" stroke-width="3" />
      <line x1="302" y1="260" x2="222" y2="340" stroke="#B45309" stroke-width="3" />
      <!-- Scoops -->
      <circle cx="256" cy="210" r="65" fill="#38BDF8" />
      <circle cx="256" cy="155" r="55" fill="#F472B6" />
      <!-- Cherry -->
      <circle cx="256" cy="95" r="16" fill="#DC2626" />
    </g>
  </svg>