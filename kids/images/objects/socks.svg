<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_socks" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF5FF" />
      <stop offset="100%" stop-color="#F3E8FF" />
    </linearGradient>
    <radialGradient id="glow_socks" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow_socks" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
    <filter id="softShadow_socks" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.12" />
    </filter>
    
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="96" fill="url(#bg_socks)" />
  <circle cx="256" cy="256" r="210" fill="url(#glow_socks)" />

    <g filter="url(#shadow_socks)">
      <path d="M 210 150 L 260 150 L 260 270 Q 310 280 320 330 Q 300 360 240 340 L 210 270 Z" fill="#A855F7" />
      <!-- Stripes -->
      <rect x="210" y="170" width="50" height="15" fill="#FDE047" />
      <rect x="210" y="200" width="50" height="15" fill="#FDE047" />
    </g>
  </svg>