<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_kite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0FDF4" />
      <stop offset="100%" stop-color="#DCFCE7" />
    </linearGradient>
    <radialGradient id="glow_kite" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow_kite" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
    <filter id="softShadow_kite" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.12" />
    </filter>
    
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="96" fill="url(#bg_kite)" />
  <circle cx="256" cy="256" r="210" fill="url(#glow_kite)" />

    <g filter="url(#shadow_kite)">
      <!-- Kite Diamond -->
      <polygon points="256,120 352,220 256,330 160,220" fill="#F59E0B" />
      <polygon points="256,120 352,220 256,220" fill="#EF4444" />
      <polygon points="160,220 256,220 256,330" fill="#3B82F6" />
      <!-- Tail & Bows -->
      <path d="M 256 330 Q 280 370 250 400" fill="none" stroke="#78350F" stroke-width="3" />
      <polygon points="270,360 285,355 285,365" fill="#EC4899" />
      <polygon points="255,385 240,380 240,390" fill="#10B981" />
    </g>
  </svg>