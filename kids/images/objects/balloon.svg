<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_balloon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF1F2" />
      <stop offset="100%" stop-color="#FFE4E6" />
    </linearGradient>
    <radialGradient id="glow_balloon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow_balloon" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
    <filter id="softShadow_balloon" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.12" />
    </filter>
    
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="96" fill="url(#bg_balloon)" />
  <circle cx="256" cy="256" r="210" fill="url(#glow_balloon)" />

    <g filter="url(#shadow_balloon)">
      <!-- String -->
      <path d="M 256 310 Q 240 350 260 380" fill="none" stroke="#94A3B8" stroke-width="4" stroke-linecap="round" />
      <!-- Balloon -->
      <ellipse cx="256" cy="210" rx="90" ry="105" fill="#EF4444" />
      <polygon points="256,310 246,325 266,325" fill="#DC2626" />
      <!-- Shine -->
      <ellipse cx="220" cy="170" rx="14" ry="28" fill="#FFFFFF" opacity="0.6" transform="rotate(-25 220 170)" />
    </g>
  </svg>