<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_doll" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF2F8" />
      <stop offset="100%" stop-color="#FCE7F3" />
    </linearGradient>
    <radialGradient id="glow_doll" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow_doll" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
    <filter id="softShadow_doll" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.12" />
    </filter>
    
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="96" fill="url(#bg_doll)" />
  <circle cx="256" cy="256" r="210" fill="url(#glow_doll)" />

    <g filter="url(#shadow_doll)">
      <circle cx="256" cy="180" r="60" fill="#FED7AA" />
      <path d="M 200 240 L 312 240 L 340 360 L 170 360 Z" fill="#EC4899" />
      <circle cx="236" cy="175" r="8" fill="#1E293B" /><circle cx="276" cy="175" r="8" fill="#1E293B" />
      <ellipse cx="215" cy="195" rx="10" ry="6" fill="#FB7185" /><ellipse cx="297" cy="195" rx="10" ry="6" fill="#FB7185" />
    </g>
  </svg>