<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_gift-box" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF5FF" />
      <stop offset="100%" stop-color="#F3E8FF" />
    </linearGradient>
    <radialGradient id="glow_gift-box" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow_gift-box" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
    <filter id="softShadow_gift-box" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.12" />
    </filter>
    
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="96" fill="url(#bg_gift-box)" />
  <circle cx="256" cy="256" r="210" fill="url(#glow_gift-box)" />

    <g filter="url(#shadow_gift_box)">
      <rect x="150" y="200" width="212" height="160" rx="16" fill="#8B5CF6" />
      <rect x="236" y="200" width="40" height="160" fill="#F59E0B" />
      <rect x="150" y="260" width="212" height="40" fill="#F59E0B" />
      <ellipse cx="220" cy="180" rx="30" ry="20" fill="#FBBF24" transform="rotate(-25 220 180)" />
      <ellipse cx="292" cy="180" rx="30" ry="20" fill="#FBBF24" transform="rotate(25 292 180)" />
    </g>
  </svg>