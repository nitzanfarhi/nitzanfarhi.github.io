<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_apple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF1F2" />
      <stop offset="100%" stop-color="#FFE4E6" />
    </linearGradient>
    <radialGradient id="glow_apple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow_apple" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
    <filter id="softShadow_apple" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.12" />
    </filter>
    
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="96" fill="url(#bg_apple)" />
  <circle cx="256" cy="256" r="210" fill="url(#glow_apple)" />

    <g filter="url(#shadow_apple)">
      <!-- Stem & Leaf -->
      <path d="M 256 160 Q 270 110 290 100" fill="none" stroke="#78350F" stroke-width="8" stroke-linecap="round" />
      <ellipse cx="300" cy="125" rx="22" ry="12" fill="#22C55E" transform="rotate(-30 300 125)" />
      <!-- Apple lobes -->
      <circle cx="210" cy="256" r="90" fill="#DC2626" />
      <circle cx="302" cy="256" r="90" fill="#EF4444" />
      <!-- Shine -->
      <ellipse cx="180" cy="220" rx="16" ry="32" fill="#FFFFFF" opacity="0.6" transform="rotate(-25 180 220)" />
    </g>
  </svg>