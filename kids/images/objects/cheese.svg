<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_cheese" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEFCE8" />
      <stop offset="100%" stop-color="#FEF08A" />
    </linearGradient>
    <radialGradient id="glow_cheese" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow_cheese" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
    <filter id="softShadow_cheese" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.12" />
    </filter>
    
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="96" fill="url(#bg_cheese)" />
  <circle cx="256" cy="256" r="210" fill="url(#glow_cheese)" />

    <g filter="url(#shadow_cheese)">
      <!-- Wedge -->
      <polygon points="120,280 392,200 392,300 120,340" fill="#F59E0B" />
      <polygon points="120,280 230,160 392,200" fill="#FBBF24" />
      <!-- Holes -->
      <ellipse cx="220" cy="300" rx="18" ry="14" fill="#D97706" />
      <ellipse cx="320" cy="260" rx="22" ry="18" fill="#D97706" />
      <ellipse cx="280" cy="190" rx="14" ry="8" fill="#D97706" />
    </g>
  </svg>