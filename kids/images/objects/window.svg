<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_window" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F9FF" />
      <stop offset="100%" stop-color="#E0F2FE" />
    </linearGradient>
    <radialGradient id="glow_window" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow_window" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
    <filter id="softShadow_window" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.12" />
    </filter>
    
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="96" fill="url(#bg_window)" />
  <circle cx="256" cy="256" r="210" fill="url(#glow_window)" />

    <g filter="url(#shadow_window)">
      <rect x="150" y="150" width="212" height="212" rx="16" fill="#94A3B8" />
      <rect x="165" y="165" width="85" height="85" rx="6" fill="#38BDF8" />
      <rect x="262" y="165" width="85" height="85" rx="6" fill="#38BDF8" />
      <rect x="165" y="262" width="85" height="85" rx="6" fill="#38BDF8" />
      <rect x="262" y="262" width="85" height="85" rx="6" fill="#38BDF8" />
    </g>
  </svg>