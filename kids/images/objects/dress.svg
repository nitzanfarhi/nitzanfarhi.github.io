<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_dress" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF1F2" />
      <stop offset="100%" stop-color="#FFE4E6" />
    </linearGradient>
    <radialGradient id="glow_dress" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow_dress" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
    <filter id="softShadow_dress" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.12" />
    </filter>
    
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="96" fill="url(#bg_dress)" />
  <circle cx="256" cy="256" r="210" fill="url(#glow_dress)" />

    <g filter="url(#shadow_dress)">
      <!-- Top -->
      <path d="M 210 150 L 230 220 L 282 220 L 302 150 Z" fill="#EC4899" />
      <!-- Skirt -->
      <path d="M 230 220 L 140 350 Q 256 370 372 350 L 282 220 Z" fill="#F43F5E" />
      <!-- Polka Dots -->
      <circle cx="200" cy="280" r="10" fill="#FFFFFF" />
      <circle cx="260" cy="290" r="10" fill="#FFFFFF" />
      <circle cx="312" cy="280" r="10" fill="#FFFFFF" />
      <circle cx="230" cy="330" r="10" fill="#FFFFFF" />
      <circle cx="290" cy="330" r="10" fill="#FFFFFF" />
    </g>
  </svg>