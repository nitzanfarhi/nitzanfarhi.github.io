<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_brush" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF2F2" />
      <stop offset="100%" stop-color="#FEE2E2" />
    </linearGradient>
    <radialGradient id="glow_brush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow_brush" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
    <filter id="softShadow_brush" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.12" />
    </filter>
    
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="96" fill="url(#bg_brush)" />
  <circle cx="256" cy="256" r="210" fill="url(#glow_brush)" />

    <g filter="url(#shadow_brush)" transform="rotate(30 256 256)">
      <rect x="236" y="200" width="40" height="160" rx="10" fill="#B45309" />
      <rect x="230" y="170" width="52" height="30" fill="#94A3B8" />
      <path d="M 230 170 L 230 110 Q 256 90 282 110 L 282 170 Z" fill="#EF4444" />
    </g>
  </svg>