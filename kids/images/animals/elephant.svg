<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_elephant" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0FDF4" />
      <stop offset="100%" stop-color="#DCFCE7" />
    </linearGradient>
    <radialGradient id="glow_elephant" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow_elephant" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
    <filter id="softShadow_elephant" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.12" />
    </filter>
    
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="96" fill="url(#bg_elephant)" />
  <circle cx="256" cy="256" r="210" fill="url(#glow_elephant)" />

    <g filter="url(#shadow_elephant)">
      <ellipse cx="130" cy="230" rx="75" ry="85" fill="#94A3B8" />
      <ellipse cx="130" cy="230" rx="55" ry="65" fill="#F472B6" opacity="0.4" />
      <ellipse cx="382" cy="230" rx="75" ry="85" fill="#94A3B8" />
      <ellipse cx="382" cy="230" rx="55" ry="65" fill="#F472B6" opacity="0.4" />
      <ellipse cx="256" cy="230" rx="100" ry="95" fill="#64748B" />
      <path d="M 236 260 C 236 340, 286 360, 306 340 C 316 330, 306 315, 296 325 C 276 340, 256 310, 256 260 Z" fill="#64748B" stroke="#475569" stroke-width="3" />
      
  <!-- Cute Face -->
  <g transform="translate(256, 205) scale(1)">
    <!-- Blush -->
    <ellipse cx="-65" cy="10" rx="16" ry="9" fill="#FF8BA7" opacity="0.6" />
    <ellipse cx="65" cy="10" rx="16" ry="9" fill="#FF8BA7" opacity="0.6" />
    <!-- Left Eye -->
    <circle cx="-38" cy="-10" r="14" fill="#1E293B" />
    <circle cx="-42" cy="-15" r="5" fill="#FFFFFF" />
    <circle cx="-34" cy="-7" r="2.5" fill="#FFFFFF" />
    <!-- Right Eye -->
    <circle cx="38" cy="-10" r="14" fill="#1E293B" />
    <circle cx="34" cy="-15" r="5" fill="#FFFFFF" />
    <circle cx="42" cy="-7" r="2.5" fill="#FFFFFF" />
    <!-- Smile -->
    <path d="M -16 15 Q 0 30 16 15" fill="none" stroke="#1E293B" stroke-width="5" stroke-linecap="round" />
  </g>

    </g>
  </svg>