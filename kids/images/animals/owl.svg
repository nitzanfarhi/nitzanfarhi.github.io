<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_owl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF5FF" />
      <stop offset="100%" stop-color="#F3E8FF" />
    </linearGradient>
    <radialGradient id="glow_owl" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow_owl" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
    <filter id="softShadow_owl" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.12" />
    </filter>
    
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="96" fill="url(#bg_owl)" />
  <circle cx="256" cy="256" r="210" fill="url(#glow_owl)" />

    <g filter="url(#shadow_owl)">
      <ellipse cx="256" cy="260" rx="115" ry="125" fill="#9333EA" />
      <ellipse cx="256" cy="305" rx="70" ry="75" fill="#F3E8FF" />
      <circle cx="195" cy="210" r="38" fill="#FFFFFF" /><circle cx="195" cy="210" r="20" fill="#1E293B" />
      <circle cx="317" cy="210" r="38" fill="#FFFFFF" /><circle cx="317" cy="210" r="20" fill="#1E293B" />
      <polygon points="256,250 240,225 272,225" fill="#F59E0B" />
    </g>
  </svg>