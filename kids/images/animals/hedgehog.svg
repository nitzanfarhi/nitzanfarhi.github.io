<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_hedgehog" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="100%" stop-color="#FEF3C7" />
    </linearGradient>
    <radialGradient id="glow_hedgehog" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow_hedgehog" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
    <filter id="softShadow_hedgehog" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.12" />
    </filter>
    
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="96" fill="url(#bg_hedgehog)" />
  <circle cx="256" cy="256" r="210" fill="url(#glow_hedgehog)" />

    <g filter="url(#shadow_hedgehog)">
      <ellipse cx="256" cy="275" rx="100" ry="80" fill="#D97706" />
      <ellipse cx="200" cy="285" rx="55" ry="40" fill="#FED7AA" />
      <circle cx="150" cy="285" r="10" fill="#1E293B" />
      <circle cx="195" cy="265" r="10" fill="#1E293B" />
    </g>
  </svg>