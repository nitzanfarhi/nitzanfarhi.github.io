<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_snake" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECFDF5" />
      <stop offset="100%" stop-color="#D1FAE5" />
    </linearGradient>
    <radialGradient id="glow_snake" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow_snake" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
    <filter id="softShadow_snake" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.12" />
    </filter>
    
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="96" fill="url(#bg_snake)" />
  <circle cx="256" cy="256" r="210" fill="url(#glow_snake)" />

    <g filter="url(#shadow_snake)">
      <path d="M 120 340 C 140 280, 240 280, 260 340 C 280 390, 380 390, 400 320 C 410 270, 360 220, 300 220 L 256 220" fill="none" stroke="#22C55E" stroke-width="42" stroke-linecap="round" />
      <ellipse cx="230" cy="200" rx="60" ry="45" fill="#4ADE80" />
      <path d="M 170 200 L 130 200 L 115 190 M 130 200 L 115 210" fill="none" stroke="#EF4444" stroke-width="4" stroke-linecap="round" />
      <circle cx="210" cy="185" r="10" fill="#1E293B" /><circle cx="250" cy="185" r="10" fill="#1E293B" />
      <ellipse cx="230" cy="215" rx="12" ry="6" fill="#F43F5E" opacity="0.6" />
    </g>
  </svg>