<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_dog" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="100%" stop-color="#FEF3C7" />
    </linearGradient>
    <radialGradient id="glow_dog" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow_dog" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
    <filter id="softShadow_dog" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.12" />
    </filter>
    
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="96" fill="url(#bg_dog)" />
  <circle cx="256" cy="256" r="210" fill="url(#glow_dog)" />

    <g filter="url(#shadow_dog)">
      <ellipse cx="140" cy="180" rx="35" ry="70" fill="#92400E" transform="rotate(-20 140 180)"/>
      <ellipse cx="372" cy="180" rx="35" ry="70" fill="#92400E" transform="rotate(20 372 180)"/>
      <ellipse cx="256" cy="240" rx="120" ry="110" fill="#D97706" />
      <ellipse cx="256" cy="275" rx="55" ry="45" fill="#FDE68A" />
      <polygon points="256,260 236,245 276,245" fill="#1E293B" />
      
  <!-- Cute Face -->
  <g transform="translate(256, 220) scale(1.1)">
    <!-- Blush -->
    <ellipse cx="-80" cy="10" rx="16" ry="9" fill="#FF8BA7" opacity="0.6" />
    <ellipse cx="80" cy="10" rx="16" ry="9" fill="#FF8BA7" opacity="0.6" />
    <!-- Left Eye -->
    <circle cx="-38" cy="-10" r="14" fill="#1E293B" />
    <circle cx="-42" cy="-15" r="5" fill="#FFFFFF" />
    <circle cx="-34" cy="-7" r="2.5" fill="#FFFFFF" />
    <!-- Right Eye -->
    <circle cx="38" cy="-10" r="14" fill="#1E293B" />
    <circle cx="34" cy="-15" r="5" fill="#FFFFFF" />
    <circle cx="42" cy="-7" r="2.5" fill="#FFFFFF" />
    <!-- Smile -->
    <path d="M -16 40 Q 0 55 16 40" fill="none" stroke="#1E293B" stroke-width="5" stroke-linecap="round" />
  </g>

      <path d="M 248 280 Q 256 305 264 280 Z" fill="#F43F5E" />
    </g>
  </svg>