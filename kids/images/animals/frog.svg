<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_frog" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECFDF5" />
      <stop offset="100%" stop-color="#D1FAE5" />
    </linearGradient>
    <radialGradient id="glow_frog" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow_frog" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
    <filter id="softShadow_frog" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.12" />
    </filter>
    
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="96" fill="url(#bg_frog)" />
  <circle cx="256" cy="256" r="210" fill="url(#glow_frog)" />

    <g filter="url(#shadow_frog)">
      <circle cx="170" cy="160" r="45" fill="#22C55E" /><circle cx="342" cy="160" r="45" fill="#22C55E" />
      <ellipse cx="256" cy="250" rx="130" ry="95" fill="#4ADE80" />
      <circle cx="170" cy="155" r="30" fill="#FFFFFF" /><circle cx="170" cy="155" r="16" fill="#1E293B" />
      <circle cx="342" cy="155" r="30" fill="#FFFFFF" /><circle cx="342" cy="155" r="16" fill="#1E293B" />
      <path d="M 180 240 Q 256 295 332 240" fill="none" stroke="#15803D" stroke-width="6" stroke-linecap="round" />
    </g>
  </svg>