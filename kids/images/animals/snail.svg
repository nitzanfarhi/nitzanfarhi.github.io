<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_snail" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECFDF5" />
      <stop offset="100%" stop-color="#D1FAE5" />
    </linearGradient>
    <radialGradient id="glow_snail" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow_snail" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
    <filter id="softShadow_snail" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.12" />
    </filter>
    
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="96" fill="url(#bg_snail)" />
  <circle cx="256" cy="256" r="210" fill="url(#glow_snail)" />

    <g filter="url(#shadow_snail)">
      <path d="M 120 330 C 220 330, 360 330, 390 330 C 410 330, 420 300, 390 280 C 370 270, 330 300, 260 310 Z" fill="#86EFAC" />
      <circle cx="220" cy="240" r="85" fill="#F59E0B" />
      <circle cx="220" cy="240" r="60" fill="#FBBF24" />
      <circle cx="220" cy="240" r="35" fill="#FDE68A" />
      <line x1="375" y1="280" x2="385" y2="240" stroke="#4ADE80" stroke-width="6" stroke-linecap="round" /><circle cx="385" cy="240" r="8" fill="#1E293B" />
      <ellipse cx="360" cy="300" rx="8" ry="5" fill="#F43F5E" opacity="0.7" />
    </g>
  </svg>