<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_hippo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF" />
      <stop offset="100%" stop-color="#DBEAFE" />
    </linearGradient>
    <radialGradient id="glow_hippo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow_hippo" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
    <filter id="softShadow_hippo" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.12" />
    </filter>
    
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="96" fill="url(#bg_hippo)" />
  <circle cx="256" cy="256" r="210" fill="url(#glow_hippo)" />

    <g filter="url(#shadow_hippo)">
      <circle cx="256" cy="210" r="95" fill="#94A3B8" />
      <ellipse cx="256" cy="295" rx="110" ry="75" fill="#CBD5E1" />
      <circle cx="215" cy="270" r="16" fill="#475569" /><circle cx="297" cy="270" r="16" fill="#475569" />
      
  <!-- Cute Face -->
  <g transform="translate(256, 185) scale(1)">
    <!-- Blush -->
    <ellipse cx="-65" cy="10" rx="16" ry="9" fill="#FF8BA7" opacity="0.6" />
    <ellipse cx="65" cy="10" rx="16" ry="9" fill="#FF8BA7" opacity="0.6" />
    <!-- Left Eye -->
    <circle cx="-38" cy="-10" r="14" fill="#1E293B" />
    <circle cx="-42" cy="-15" r="5" fill="#FFFFFF" />
    <circle cx="-34" cy="-7" r="2.5" fill="#FFFFFF" />
    <!-- Right Eye -->
    <circle cx="38" cy="-10" r="14" fill="#1E293B" />
    <circle cx="34" cy="-15" r="5" fill="#FFFFFF" />
    <circle cx="42" cy="-7" r="2.5" fill="#FFFFFF" />
    <!-- Smile -->
    <path d="M -16 65 Q 0 80 16 65" fill="none" stroke="#1E293B" stroke-width="5" stroke-linecap="round" />
  </g>

    </g>
  </svg>