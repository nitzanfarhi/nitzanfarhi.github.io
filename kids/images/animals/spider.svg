<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_spider" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF5FF" />
      <stop offset="100%" stop-color="#F3E8FF" />
    </linearGradient>
    <radialGradient id="glow_spider" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow_spider" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
    <filter id="softShadow_spider" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.12" />
    </filter>
    
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="96" fill="url(#bg_spider)" />
  <circle cx="256" cy="256" r="210" fill="url(#glow_spider)" />

    <g filter="url(#shadow_spider)">
      <line x1="256" y1="50" x2="256" y2="180" stroke="#CBD5E1" stroke-width="4" />
      
        <path d="M 256 256 Q 76 245 98.5 360" fill="none" stroke="#1E293B" stroke-width="8" stroke-linecap="round" />
      
        <path d="M 256 256 Q 176 220 186 360" fill="none" stroke="#1E293B" stroke-width="8" stroke-linecap="round" />
      
        <path d="M 256 256 Q 336 220 326 360" fill="none" stroke="#1E293B" stroke-width="8" stroke-linecap="round" />
      
        <path d="M 256 256 Q 436 245 413.5 360" fill="none" stroke="#1E293B" stroke-width="8" stroke-linecap="round" />
      
      <circle cx="256" cy="256" r="85" fill="#1E293B" />
      <circle cx="230" cy="245" r="14" fill="#FFFFFF" /><circle cx="230" cy="245" r="7" fill="#000000" />
      <circle cx="282" cy="245" r="14" fill="#FFFFFF" /><circle cx="282" cy="245" r="7" fill="#000000" />
      <ellipse cx="205" cy="275" rx="10" ry="6" fill="#F43F5E" opacity="0.7" /><ellipse cx="307" cy="275" rx="10" ry="6" fill="#F43F5E" opacity="0.7" />
      <path d="M 245 285 Q 256 295 267 285" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
    </g>
  </svg>