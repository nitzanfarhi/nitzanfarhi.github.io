<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_monkey" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF2F8" />
      <stop offset="100%" stop-color="#FCE7F3" />
    </linearGradient>
    <radialGradient id="glow_monkey" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow_monkey" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
    <filter id="softShadow_monkey" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.12" />
    </filter>
    
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="96" fill="url(#bg_monkey)" />
  <circle cx="256" cy="256" r="210" fill="url(#glow_monkey)" />

    <g filter="url(#shadow_monkey)">
      <circle cx="140" cy="230" r="45" fill="#78350F" /><circle cx="140" cy="230" r="28" fill="#FDE68A" />
      <circle cx="372" cy="230" r="45" fill="#78350F" /><circle cx="372" cy="230" r="28" fill="#FDE68A" />
      <ellipse cx="256" cy="230" rx="105" ry="95" fill="#92400E" />
      <path d="M 180 220 C 180 170, 240 170, 256 200 C 272 170, 332 170, 332 220 C 332 275, 180 275, 180 220 Z" fill="#FDE68A" />
      <ellipse cx="256" cy="265" rx="60" ry="40" fill="#FDE68A" />
      <circle cx="242" cy="255" r="5" fill="#78350F" /><circle cx="270" cy="255" r="5" fill="#78350F" />
      
  <!-- Cute Face -->
  <g transform="translate(256, 210) scale(0.95)">
    <!-- Blush -->
    <ellipse cx="-55" cy="10" rx="16" ry="9" fill="#FF8BA7" opacity="0.6" />
    <ellipse cx="55" cy="10" rx="16" ry="9" fill="#FF8BA7" opacity="0.6" />
    <!-- Left Eye -->
    <circle cx="-38" cy="-10" r="14" fill="#1E293B" />
    <circle cx="-42" cy="-15" r="5" fill="#FFFFFF" />
    <circle cx="-34" cy="-7" r="2.5" fill="#FFFFFF" />
    <!-- Right Eye -->
    <circle cx="38" cy="-10" r="14" fill="#1E293B" />
    <circle cx="34" cy="-15" r="5" fill="#FFFFFF" />
    <circle cx="42" cy="-7" r="2.5" fill="#FFFFFF" />
    <!-- Smile -->
    <path d="M -16 50 Q 0 65 16 50" fill="none" stroke="#1E293B" stroke-width="5" stroke-linecap="round" />
  </g>

    </g>
  </svg>