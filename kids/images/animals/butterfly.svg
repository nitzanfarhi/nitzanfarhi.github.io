<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_butterfly" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF2F8" />
      <stop offset="100%" stop-color="#FCE7F3" />
    </linearGradient>
    <radialGradient id="glow_butterfly" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow_butterfly" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
    <filter id="softShadow_butterfly" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.12" />
    </filter>
    
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="96" fill="url(#bg_butterfly)" />
  <circle cx="256" cy="256" r="210" fill="url(#glow_butterfly)" />

    <g filter="url(#shadow_butterfly)">
      <ellipse cx="170" cy="190" rx="75" ry="65" fill="#EC4899" transform="rotate(-20 170 190)" /><circle cx="170" cy="190" r="25" fill="#FDE047" />
      <ellipse cx="342" cy="190" rx="75" ry="65" fill="#EC4899" transform="rotate(20 342 190)" /><circle cx="342" cy="190" r="25" fill="#FDE047" />
      <ellipse cx="256" cy="255" rx="20" ry="85" fill="#1E293B" />
      <circle cx="250" cy="210" r="4" fill="#FFFFFF" /><circle cx="262" cy="210" r="4" fill="#FFFFFF" />
    </g>
  </svg>