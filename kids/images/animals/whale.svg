<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_whale" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF" />
      <stop offset="100%" stop-color="#DBEAFE" />
    </linearGradient>
    <radialGradient id="glow_whale" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow_whale" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
    <filter id="softShadow_whale" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.12" />
    </filter>
    
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="96" fill="url(#bg_whale)" />
  <circle cx="256" cy="256" r="210" fill="url(#glow_whale)" />

    <g filter="url(#shadow_whale)">
      <path d="M 80 260 C 120 160, 280 140, 390 200 C 430 240, 400 320, 260 330 C 140 340, 90 280, 80 260 Z" fill="#2563EB" />
      <circle cx="340" cy="230" r="12" fill="#1E293B" />
      <ellipse cx="320" cy="255" rx="14" ry="8" fill="#F472B6" opacity="0.6" />
      <path d="M 355 260 Q 375 270 395 255" fill="none" stroke="#1E3A8A" stroke-width="5" stroke-linecap="round" />
    </g>
  </svg>