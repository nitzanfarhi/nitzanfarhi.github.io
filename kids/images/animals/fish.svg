<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_fish" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF" />
      <stop offset="100%" stop-color="#DBEAFE" />
    </linearGradient>
    <radialGradient id="glow_fish" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow_fish" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
    <filter id="softShadow_fish" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.12" />
    </filter>
    
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="96" fill="url(#bg_fish)" />
  <circle cx="256" cy="256" r="210" fill="url(#glow_fish)" />

    <g filter="url(#shadow_fish)">
      <polygon points="120,256 40,180 60,256 40,332" fill="#38BDF8" />
      <ellipse cx="270" cy="256" rx="130" ry="95" fill="#38BDF8" />
      <circle cx="340" cy="235" r="18" fill="#1E293B" /><circle cx="334" cy="228" r="7" fill="#FFFFFF" />
      <ellipse cx="330" cy="265" rx="12" ry="7" fill="#FB7185" opacity="0.7" />
    </g>
  </svg>