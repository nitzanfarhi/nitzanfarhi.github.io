<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_giraffe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEFCE8" />
      <stop offset="100%" stop-color="#FEF08A" />
    </linearGradient>
    <radialGradient id="glow_giraffe" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow_giraffe" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
    <filter id="softShadow_giraffe" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.12" />
    </filter>
    
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="96" fill="url(#bg_giraffe)" />
  <circle cx="256" cy="256" r="210" fill="url(#glow_giraffe)" />

    <g filter="url(#shadow_giraffe)">
      <line x1="220" y1="140" x2="210" y2="90" stroke="#CA8A04" stroke-width="12" stroke-linecap="round" /><circle cx="210" cy="85" r="14" fill="#854D0E" />
      <line x1="292" y1="140" x2="302" y2="90" stroke="#CA8A04" stroke-width="12" stroke-linecap="round" /><circle cx="302" cy="85" r="14" fill="#854D0E" />
      <ellipse cx="160" cy="150" rx="35" ry="18" fill="#FACC15" transform="rotate(-30 160 150)" />
      <ellipse cx="352" cy="150" rx="35" ry="18" fill="#FACC15" transform="rotate(30 352 150)" />
      <ellipse cx="256" cy="210" rx="90" ry="105" fill="#FACC15" />
      <circle cx="200" cy="180" r="14" fill="#A16207" /><circle cx="310" cy="190" r="16" fill="#A16207" />
      <ellipse cx="256" cy="265" rx="65" ry="45" fill="#FEF08A" />
      
  <!-- Cute Face -->
  <g transform="translate(256, 190) scale(0.95)">
    <!-- Blush -->
    <ellipse cx="-60" cy="10" rx="16" ry="9" fill="#FF8BA7" opacity="0.6" />
    <ellipse cx="60" cy="10" rx="16" ry="9" fill="#FF8BA7" opacity="0.6" />
    <!-- Left Eye -->
    <circle cx="-38" cy="-10" r="14" fill="#1E293B" />
    <circle cx="-42" cy="-15" r="5" fill="#FFFFFF" />
    <circle cx="-34" cy="-7" r="2.5" fill="#FFFFFF" />
    <!-- Right Eye -->
    <circle cx="38" cy="-10" r="14" fill="#1E293B" />
    <circle cx="34" cy="-15" r="5" fill="#FFFFFF" />
    <circle cx="42" cy="-7" r="2.5" fill="#FFFFFF" />
    <!-- Smile -->
    <path d="M -16 65 Q 0 80 16 65" fill="none" stroke="#1E293B" stroke-width="5" stroke-linecap="round" />
  </g>

    </g>
  </svg>