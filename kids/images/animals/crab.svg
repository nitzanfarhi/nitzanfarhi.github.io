<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_crab" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF1F2" />
      <stop offset="100%" stop-color="#FFE4E6" />
    </linearGradient>
    <radialGradient id="glow_crab" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow_crab" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
    <filter id="softShadow_crab" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.12" />
    </filter>
    
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="96" fill="url(#bg_crab)" />
  <circle cx="256" cy="256" r="210" fill="url(#glow_crab)" />

    <g filter="url(#shadow_crab)">
      <ellipse cx="256" cy="275" rx="110" ry="80" fill="#F87171" />
      <circle cx="210" cy="180" r="20" fill="#FFFFFF" /><circle cx="210" cy="180" r="10" fill="#1E293B" />
      <circle cx="302" cy="180" r="20" fill="#FFFFFF" /><circle cx="302" cy="180" r="10" fill="#1E293B" />
      <path d="M 220 285 Q 256 320 292 285" fill="none" stroke="#991B1B" stroke-width="5" stroke-linecap="round" />
    </g>
  </svg>