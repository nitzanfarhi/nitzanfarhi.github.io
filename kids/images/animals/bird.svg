<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_bird" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0FDFA" />
      <stop offset="100%" stop-color="#CCFBF1" />
    </linearGradient>
    <radialGradient id="glow_bird" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow_bird" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
    <filter id="softShadow_bird" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.12" />
    </filter>
    
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="96" fill="url(#bg_bird)" />
  <circle cx="256" cy="256" r="210" fill="url(#glow_bird)" />

    <g filter="url(#shadow_bird)">
      <!-- Wing -->
      <ellipse cx="210" cy="265" rx="55" ry="35" fill="#0284C7" transform="rotate(-15 210 265)" />
      <!-- Body -->
      <circle cx="265" cy="245" r="95" fill="#38BDF8" />
      <!-- Beak -->
      <polygon points="360,235 410,250 360,265" fill="#F97316" />
      <!-- Eye & Blush -->
      <circle cx="320" cy="220" r="14" fill="#1E293B" />
      <circle cx="315" cy="215" r="5" fill="#FFFFFF" />
      <ellipse cx="300" cy="250" rx="14" ry="8" fill="#FB7185" opacity="0.6" />
      <!-- Little Crown Feathers -->
      <path d="M 240 150 Q 230 110 250 135 Q 260 100 275 140" fill="none" stroke="#0284C7" stroke-width="6" stroke-linecap="round" />
    </g>
  </svg>