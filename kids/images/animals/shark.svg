<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_shark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F9FF" />
      <stop offset="100%" stop-color="#E0F2FE" />
    </linearGradient>
    <radialGradient id="glow_shark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow_shark" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
    <filter id="softShadow_shark" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.12" />
    </filter>
    
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="96" fill="url(#bg_shark)" />
  <circle cx="256" cy="256" r="210" fill="url(#glow_shark)" />

    <g filter="url(#shadow_shark)">
      <polygon points="230,190 260,100 300,190" fill="#0284C7" />
      <ellipse cx="256" cy="265" rx="135" ry="85" fill="#38BDF8" />
      <polygon points="125,265 60,190 80,265 60,340" fill="#0284C7" />
      <circle cx="345" cy="235" r="12" fill="#1E293B" /><circle cx="341" cy="231" r="5" fill="#FFFFFF" />
      <polygon points="330,280 340,270 350,280" fill="#FFFFFF" />
    </g>
  </svg>