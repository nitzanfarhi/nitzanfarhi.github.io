<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_octopus" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF5FF" />
      <stop offset="100%" stop-color="#F3E8FF" />
    </linearGradient>
    <radialGradient id="glow_octopus" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow_octopus" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
    <filter id="softShadow_octopus" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.12" />
    </filter>
    
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="96" fill="url(#bg_octopus)" />
  <circle cx="256" cy="256" r="210" fill="url(#glow_octopus)" />

    <g filter="url(#shadow_octopus)">
      <path d="M 160 280 Q 140 390 160 410" fill="none" stroke="#A855F7" stroke-width="26" stroke-linecap="round" /><path d="M 208 280 Q 195 390 208 410" fill="none" stroke="#A855F7" stroke-width="26" stroke-linecap="round" /><path d="M 256 280 Q 250 390 256 410" fill="none" stroke="#A855F7" stroke-width="26" stroke-linecap="round" /><path d="M 304 280 Q 305 390 304 410" fill="none" stroke="#A855F7" stroke-width="26" stroke-linecap="round" /><path d="M 352 280 Q 360 390 352 410" fill="none" stroke="#A855F7" stroke-width="26" stroke-linecap="round" />
      <ellipse cx="256" cy="220" rx="110" ry="100" fill="#C084FC" />
      
  <!-- Cute Face -->
  <g transform="translate(256, 215) scale(1.1)">
    <!-- Blush -->
    <ellipse cx="-75" cy="10" rx="16" ry="9" fill="#FF8BA7" opacity="0.6" />
    <ellipse cx="75" cy="10" rx="16" ry="9" fill="#FF8BA7" opacity="0.6" />
    <!-- Left Eye -->
    <circle cx="-38" cy="-10" r="14" fill="#1E293B" />
    <circle cx="-42" cy="-15" r="5" fill="#FFFFFF" />
    <circle cx="-34" cy="-7" r="2.5" fill="#FFFFFF" />
    <!-- Right Eye -->
    <circle cx="38" cy="-10" r="14" fill="#1E293B" />
    <circle cx="34" cy="-15" r="5" fill="#FFFFFF" />
    <circle cx="42" cy="-7" r="2.5" fill="#FFFFFF" />
    <!-- Smile -->
    <path d="M -16 30 Q 0 45 16 30" fill="none" stroke="#1E293B" stroke-width="5" stroke-linecap="round" />
  </g>

    </g>
  </svg>