<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_grizzly_bear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7" />
      <stop offset="100%" stop-color="#FDE68A" />
    </linearGradient>
    <radialGradient id="glow_grizzly_bear" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow_grizzly_bear" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
    <filter id="softShadow_grizzly_bear" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.12" />
    </filter>
    
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="96" fill="url(#bg_grizzly_bear)" />
  <circle cx="256" cy="256" r="210" fill="url(#glow_grizzly_bear)" />

    <g filter="url(#shadow_grizzly_bear)" transform="translate(256, 256)">
      <!-- Outer Glow Circle -->
      <circle cx="0" cy="0" r="140" fill="#FFFFFF" opacity="0.85" />
      <circle cx="0" cy="0" r="125" fill="#FFFBEB" stroke="#FDE68A" stroke-width="6" />
      <!-- Central Animal Emoji Graphic -->
      <text x="0" y="45" font-size="130" text-anchor="middle" font-family="'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif">🐻</text>
      <!-- Sparkle Accents -->
      <circle cx="-100" cy="-90" r="8" fill="#FBBF24" opacity="0.7" />
      <circle cx="95" cy="-85" r="6" fill="#F59E0B" opacity="0.7" />
      <circle cx="110" cy="80" r="7" fill="#FBBF24" opacity="0.7" />
    </g>
</svg>