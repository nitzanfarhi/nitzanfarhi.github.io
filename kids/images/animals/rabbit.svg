<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_rabbit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5F3FF" />
      <stop offset="100%" stop-color="#EDE9FE" />
    </linearGradient>
    <radialGradient id="glow_rabbit" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow_rabbit" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
    <filter id="softShadow_rabbit" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.12" />
    </filter>
    
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="96" fill="url(#bg_rabbit)" />
  <circle cx="256" cy="256" r="210" fill="url(#glow_rabbit)" />

    <g filter="url(#shadow_rabbit)">
      <ellipse cx="190" cy="130" rx="30" ry="90" fill="#E2E8F0" transform="rotate(-10 190 130)" />
      <ellipse cx="190" cy="130" rx="16" ry="70" fill="#F472B6" opacity="0.6" transform="rotate(-10 190 130)" />
      <ellipse cx="322" cy="130" rx="30" ry="90" fill="#E2E8F0" transform="rotate(10 322 130)" />
      <ellipse cx="322" cy="130" rx="16" ry="70" fill="#F472B6" opacity="0.6" transform="rotate(10 322 130)" />
      <ellipse cx="256" cy="265" rx="110" ry="100" fill="#F8FAFC" />
      <polygon points="256,280 244,268 268,268" fill="#F43F5E" />
      
  <!-- Cute Face -->
  <g transform="translate(256, 240) scale(1.05)">
    <!-- Blush -->
    <ellipse cx="-70" cy="10" rx="16" ry="9" fill="#FF8BA7" opacity="0.6" />
    <ellipse cx="70" cy="10" rx="16" ry="9" fill="#FF8BA7" opacity="0.6" />
    <!-- Left Eye -->
    <circle cx="-38" cy="-10" r="14" fill="#1E293B" />
    <circle cx="-42" cy="-15" r="5" fill="#FFFFFF" />
    <circle cx="-34" cy="-7" r="2.5" fill="#FFFFFF" />
    <!-- Right Eye -->
    <circle cx="38" cy="-10" r="14" fill="#1E293B" />
    <circle cx="34" cy="-15" r="5" fill="#FFFFFF" />
    <circle cx="42" cy="-7" r="2.5" fill="#FFFFFF" />
    <!-- Smile -->
    <path d="M -16 33 Q 0 48 16 33" fill="none" stroke="#1E293B" stroke-width="5" stroke-linecap="round" />
  </g>

    </g>
  </svg>