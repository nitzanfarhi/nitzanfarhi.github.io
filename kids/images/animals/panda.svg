<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_panda" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <radialGradient id="glow_panda" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow_panda" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
    <filter id="softShadow_panda" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.12" />
    </filter>
    
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="96" fill="url(#bg_panda)" />
  <circle cx="256" cy="256" r="210" fill="url(#glow_panda)" />

    <g filter="url(#shadow_panda)">
      <circle cx="155" cy="155" r="40" fill="#1E293B" /><circle cx="357" cy="155" r="40" fill="#1E293B" />
      <circle cx="256" cy="245" r="115" fill="#FFFFFF" />
      <ellipse cx="195" cy="225" rx="32" ry="25" fill="#1E293B" transform="rotate(-15 195 225)" />
      <ellipse cx="317" cy="225" rx="32" ry="25" fill="#1E293B" transform="rotate(15 317 225)" />
      <polygon points="256,268 242,254 270,254" fill="#1E293B" />
      <ellipse cx="160" cy="270" rx="16" ry="10" fill="#FB7185" opacity="0.6" />
      <ellipse cx="352" cy="270" rx="16" ry="10" fill="#FB7185" opacity="0.6" />
      <path d="M 240 275 Q 256 290 272 275" fill="none" stroke="#1E293B" stroke-width="4" stroke-linecap="round" />
    </g>
  </svg>