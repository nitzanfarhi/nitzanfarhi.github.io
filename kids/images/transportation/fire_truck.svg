<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_fire-truck" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF1F2" />
      <stop offset="100%" stop-color="#FFE4E6" />
    </linearGradient>
    <radialGradient id="glow_fire-truck" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow_fire-truck" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
    <filter id="softShadow_fire-truck" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.12" />
    </filter>
    
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="96" fill="url(#bg_fire-truck)" />
  <circle cx="256" cy="256" r="210" fill="url(#glow_fire-truck)" />

    <g filter="url(#shadow_fire_truck)">
      <rect x="100" y="160" width="180" height="120" rx="10" fill="#DC2626" />
      <path d="M 280 180 L 350 180 L 380 220 L 380 280 L 280 280 Z" fill="#EF4444" />
      <circle cx="160" cy="295" r="32" fill="#1E293B" /><circle cx="330" cy="295" r="32" fill="#1E293B" />
    </g>
  </svg>