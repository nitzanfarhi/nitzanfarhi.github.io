<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_roller-skates" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF1F2" />
      <stop offset="100%" stop-color="#FFE4E6" />
    </linearGradient>
    <radialGradient id="glow_roller-skates" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow_roller-skates" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
    <filter id="softShadow_roller-skates" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.12" />
    </filter>
    
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="96" fill="url(#bg_roller-skates)" />
  <circle cx="256" cy="256" r="210" fill="url(#glow_roller-skates)" />

    <g filter="url(#shadow_roller_skates)">
      <path d="M 160 270 L 190 170 L 260 170 L 270 230 L 350 250 L 350 290 L 160 290 Z" fill="#F43F5E" />
      <circle cx="190" cy="330" r="25" fill="#FACC15" /><circle cx="260" cy="330" r="25" fill="#FACC15" /><circle cx="330" cy="330" r="25" fill="#FACC15" />
    </g>
  </svg>