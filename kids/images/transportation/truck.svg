<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_truck" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="100%" stop-color="#FEF3C7" />
    </linearGradient>
    <radialGradient id="glow_truck" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow_truck" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
    <filter id="softShadow_truck" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.12" />
    </filter>
    
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="96" fill="url(#bg_truck)" />
  <circle cx="256" cy="256" r="210" fill="url(#glow_truck)" />

    <g filter="url(#shadow_truck)">
      <rect x="100" y="160" width="180" height="120" rx="12" fill="#3B82F6" />
      <path d="M 280 200 L 340 200 L 380 240 L 380 280 L 280 280 Z" fill="#F59E0B" />
      <circle cx="160" cy="295" r="32" fill="#1E293B" /><circle cx="340" cy="295" r="32" fill="#1E293B" />
    </g>
  </svg>