<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_segway" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <radialGradient id="glow_segway" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow_segway" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
    <filter id="softShadow_segway" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.12" />
    </filter>
    
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="96" fill="url(#bg_segway)" />
  <circle cx="256" cy="256" r="210" fill="url(#glow_segway)" />

    <g filter="url(#shadow_segway)">
      <line x1="256" y1="120" x2="256" y2="330" stroke="#475569" stroke-width="14" stroke-linecap="round" />
      <line x1="210" y1="120" x2="302" y2="120" stroke="#1E293B" stroke-width="14" stroke-linecap="round" />
      <ellipse cx="256" cy="335" rx="85" ry="25" fill="#0EA5E9" />
      <circle cx="170" cy="335" r="32" fill="#1E293B" /><circle cx="342" cy="335" r="32" fill="#1E293B" />
    </g>
  </svg>