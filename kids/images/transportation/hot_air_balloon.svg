<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_hot-air-balloon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF2F2" />
      <stop offset="100%" stop-color="#FEE2E2" />
    </linearGradient>
    <radialGradient id="glow_hot-air-balloon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow_hot-air-balloon" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
    <filter id="softShadow_hot-air-balloon" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.12" />
    </filter>
    
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="96" fill="url(#bg_hot-air-balloon)" />
  <circle cx="256" cy="256" r="210" fill="url(#glow_hot-air-balloon)" />

    <g filter="url(#shadow_hot_air_balloon)">
      <path d="M 170 200 C 140 120, 372 120, 342 200 C 322 250, 280 280, 270 290 L 242 290 C 232 280, 190 250, 170 200 Z" fill="#F43F5E" />
      <rect x="220" y="340" width="72" height="40" rx="8" fill="#B45309" />
    </g>
  </svg>