<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_tractor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECFDF5" />
      <stop offset="100%" stop-color="#D1FAE5" />
    </linearGradient>
    <radialGradient id="glow_tractor" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow_tractor" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
    <filter id="softShadow_tractor" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.12" />
    </filter>
    
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="96" fill="url(#bg_tractor)" />
  <circle cx="256" cy="256" r="210" fill="url(#glow_tractor)" />

    <g filter="url(#shadow_tractor)">
      <rect x="160" y="180" width="100" height="80" rx="8" fill="#16A34A" />
      <rect x="260" y="210" width="90" height="50" rx="8" fill="#22C55E" />
      <circle cx="190" cy="290" r="50" fill="#1E293B" /><circle cx="340" cy="305" r="30" fill="#1E293B" />
    </g>
  </svg>