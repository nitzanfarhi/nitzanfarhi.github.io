<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_yacht" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F9FF" />
      <stop offset="100%" stop-color="#E0F2FE" />
    </linearGradient>
    <radialGradient id="glow_yacht" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow_yacht" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
    <filter id="softShadow_yacht" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.12" />
    </filter>
    
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="96" fill="url(#bg_yacht)" />
  <circle cx="256" cy="256" r="210" fill="url(#glow_yacht)" />

    <g filter="url(#shadow_yacht)">
      <path d="M 100 290 L 140 350 L 400 350 L 440 270 Z" fill="#0F172A" />
      <path d="M 160 290 L 220 200 L 360 200 L 390 290 Z" fill="#FFFFFF" />
      <polygon points="230,220 330,220 350,260 230,260" fill="#38BDF8" />
    </g>
  </svg>