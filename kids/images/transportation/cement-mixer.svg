<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_cement-mixer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF7ED" />
      <stop offset="100%" stop-color="#FFEDD5" />
    </linearGradient>
    <radialGradient id="glow_cement-mixer" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow_cement-mixer" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
    <filter id="softShadow_cement-mixer" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.12" />
    </filter>
    
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="96" fill="url(#bg_cement-mixer)" />
  <circle cx="256" cy="256" r="210" fill="url(#glow_cement-mixer)" />

    <g filter="url(#shadow_cement_mixer)">
      <ellipse cx="230" cy="220" rx="80" ry="50" fill="#EA580C" transform="rotate(-20 230 220)" />
      <path d="M 270 200 L 330 200 L 360 240 L 360 290 L 270 290 Z" fill="#FBBF24" />
      <circle cx="160" cy="305" r="30" fill="#1E293B" /><circle cx="330" cy="305" r="30" fill="#1E293B" />
    </g>
  </svg>