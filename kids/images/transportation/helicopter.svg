<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_helicopter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF7ED" />
      <stop offset="100%" stop-color="#FFEDD5" />
    </linearGradient>
    <radialGradient id="glow_helicopter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow_helicopter" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
    <filter id="softShadow_helicopter" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.12" />
    </filter>
    
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="96" fill="url(#bg_helicopter)" />
  <circle cx="256" cy="256" r="210" fill="url(#glow_helicopter)" />

    <g filter="url(#shadow_helicopter)">
      <line x1="120" y1="130" x2="360" y2="130" stroke="#1E293B" stroke-width="10" stroke-linecap="round" />
      <ellipse cx="220" cy="235" rx="85" ry="65" fill="#F97316" />
      <line x1="140" y1="330" x2="290" y2="330" stroke="#1E293B" stroke-width="8" stroke-linecap="round" />
    </g>
  </svg>