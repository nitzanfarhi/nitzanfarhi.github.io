<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_crane" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="100%" stop-color="#FEF3C7" />
    </linearGradient>
    <radialGradient id="glow_crane" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow_crane" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
    <filter id="softShadow_crane" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.12" />
    </filter>
    
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="96" fill="url(#bg_crane)" />
  <circle cx="256" cy="256" r="210" fill="url(#glow_crane)" />

    <g filter="url(#shadow_crane)">
      <rect x="140" y="280" width="120" height="45" rx="10" fill="#EAB308" />
      <line x1="200" y1="280" x2="360" y2="130" stroke="#CA8A04" stroke-width="16" stroke-linecap="round" />
      <line x1="360" y1="130" x2="360" y2="240" stroke="#1E293B" stroke-width="4" />
      <path d="M 350 240 Q 360 270 370 240" fill="none" stroke="#1E293B" stroke-width="8" />
    </g>
  </svg>