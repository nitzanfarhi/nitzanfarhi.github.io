<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_motorcycle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF1F2" />
      <stop offset="100%" stop-color="#FFE4E6" />
    </linearGradient>
    <radialGradient id="glow_motorcycle" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow_motorcycle" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
    <filter id="softShadow_motorcycle" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.12" />
    </filter>
    
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="96" fill="url(#bg_motorcycle)" />
  <circle cx="256" cy="256" r="210" fill="url(#glow_motorcycle)" />

    <g filter="url(#shadow_motorcycle)">
      <circle cx="140" cy="290" r="48" fill="none" stroke="#1E293B" stroke-width="16" />
      <circle cx="372" cy="290" r="48" fill="none" stroke="#1E293B" stroke-width="16" />
      <path d="M 180 280 L 230 220 L 320 220 L 350 270 Z" fill="#EF4444" />
    </g>
  </svg>