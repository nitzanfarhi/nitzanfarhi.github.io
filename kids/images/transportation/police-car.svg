<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_police-car" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF" />
      <stop offset="100%" stop-color="#DBEAFE" />
    </linearGradient>
    <radialGradient id="glow_police-car" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow_police-car" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
    <filter id="softShadow_police-car" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.12" />
    </filter>
    
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="96" fill="url(#bg_police-car)" />
  <circle cx="256" cy="256" r="210" fill="url(#glow_police-car)" />

    <g filter="url(#shadow_police_car)">
      <path d="M 120 270 L 160 170 Q 200 160 312 160 L 372 220 L 412 250 Q 422 270 412 290 L 110 290 Z" fill="#1E293B" />
      <rect x="210" y="210" width="90" height="80" fill="#FFFFFF" />
      <circle cx="170" cy="290" r="35" fill="#1E293B" /><circle cx="350" cy="290" r="35" fill="#1E293B" />
    </g>
  </svg>