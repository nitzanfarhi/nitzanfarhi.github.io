<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_bulldozer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="100%" stop-color="#FEF3C7" />
    </linearGradient>
    <radialGradient id="glow_bulldozer" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow_bulldozer" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
    <filter id="softShadow_bulldozer" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.12" />
    </filter>
    
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="96" fill="url(#bg_bulldozer)" />
  <circle cx="256" cy="256" r="210" fill="url(#glow_bulldozer)" />

    <g filter="url(#shadow_bulldozer)">
      <rect x="140" y="290" width="180" height="45" rx="22" fill="#1E293B" />
      <rect x="170" y="195" width="120" height="95" rx="10" fill="#FACC15" />
      <path d="M 330 250 L 370 250 L 380 330 L 340 330 Z" fill="#475569" />
    </g>
  </svg>