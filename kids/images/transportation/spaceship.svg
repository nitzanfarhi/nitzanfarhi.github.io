<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_spaceship" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF5FF" />
      <stop offset="100%" stop-color="#F3E8FF" />
    </linearGradient>
    <radialGradient id="glow_spaceship" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow_spaceship" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
    <filter id="softShadow_spaceship" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.12" />
    </filter>
    
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="96" fill="url(#bg_spaceship)" />
  <circle cx="256" cy="256" r="210" fill="url(#glow_spaceship)" />

    <g filter="url(#shadow_spaceship)">
      <ellipse cx="256" cy="220" rx="75" ry="65" fill="#38BDF8" opacity="0.9" />
      <ellipse cx="256" cy="270" rx="150" ry="48" fill="#64748B" />
      <circle cx="160" cy="275" r="10" fill="#FDE047" /><circle cx="256" cy="285" r="10" fill="#FDE047" /><circle cx="352" cy="275" r="10" fill="#FDE047" />
    </g>
  </svg>