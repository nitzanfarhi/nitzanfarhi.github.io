<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_excavator" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="100%" stop-color="#FEF3C7" />
    </linearGradient>
    <radialGradient id="glow_excavator" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow_excavator" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
    <filter id="softShadow_excavator" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.12" />
    </filter>
    
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="96" fill="url(#bg_excavator)" />
  <circle cx="256" cy="256" r="210" fill="url(#glow_excavator)" />

    <g filter="url(#shadow_excavator)">
      <rect x="120" y="290" width="180" height="45" rx="22" fill="#1E293B" />
      <rect x="140" y="195" width="110" height="95" rx="10" fill="#F59E0B" />
      <polyline points="230,230 310,140 380,210 400,260" fill="none" stroke="#D97706" stroke-width="18" stroke-linecap="round" />
    </g>
  </svg>