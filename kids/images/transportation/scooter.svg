<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_scooter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0FDF4" />
      <stop offset="100%" stop-color="#DCFCE7" />
    </linearGradient>
    <radialGradient id="glow_scooter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow_scooter" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
    <filter id="softShadow_scooter" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.12" />
    </filter>
    
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="96" fill="url(#bg_scooter)" />
  <circle cx="256" cy="256" r="210" fill="url(#glow_scooter)" />

    <g filter="url(#shadow_scooter)">
      <circle cx="150" cy="330" r="28" fill="#1E293B" /><circle cx="362" cy="330" r="28" fill="#1E293B" />
      <rect x="160" y="320" width="180" height="16" rx="8" fill="#10B981" />
      <line x1="350" y1="330" x2="310" y2="150" stroke="#059669" stroke-width="12" stroke-linecap="round" />
    </g>
  </svg>