<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_garbage-truck" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECFDF5" />
      <stop offset="100%" stop-color="#D1FAE5" />
    </linearGradient>
    <radialGradient id="glow_garbage-truck" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow_garbage-truck" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
    <filter id="softShadow_garbage-truck" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.12" />
    </filter>
    
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="96" fill="url(#bg_garbage-truck)" />
  <circle cx="256" cy="256" r="210" fill="url(#glow_garbage-truck)" />

    <g filter="url(#shadow_garbage_truck)">
      <rect x="100" y="160" width="180" height="120" rx="12" fill="#059669" />
      <path d="M 280 190 L 340 190 L 375 230 L 375 280 L 280 280 Z" fill="#FFFFFF" />
      <circle cx="150" cy="295" r="30" fill="#1E293B" /><circle cx="340" cy="295" r="30" fill="#1E293B" />
    </g>
  </svg>