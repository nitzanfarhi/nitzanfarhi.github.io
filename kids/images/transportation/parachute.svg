<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_parachute" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF2F2" />
      <stop offset="100%" stop-color="#FEE2E2" />
    </linearGradient>
    <radialGradient id="glow_parachute" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow_parachute" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
    <filter id="softShadow_parachute" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.12" />
    </filter>
    
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="96" fill="url(#bg_parachute)" />
  <circle cx="256" cy="256" r="210" fill="url(#glow_parachute)" />

    <g filter="url(#shadow_parachute)">
      <path d="M 120 200 C 120 90, 392 90, 392 200 Z" fill="#EF4444" />
      <path d="M 180 200 C 180 120, 332 120, 332 200 Z" fill="#FACC15" />
      <line x1="130" y1="200" x2="256" y2="330" stroke="#78350F" stroke-width="4" />
      <line x1="382" y1="200" x2="256" y2="330" stroke="#78350F" stroke-width="4" />
      <circle cx="256" cy="350" r="20" fill="#3B82F6" />
    </g>
  </svg>