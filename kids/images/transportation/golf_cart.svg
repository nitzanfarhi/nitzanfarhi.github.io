<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_golf-cart" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECFDF5" />
      <stop offset="100%" stop-color="#D1FAE5" />
    </linearGradient>
    <radialGradient id="glow_golf-cart" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow_golf-cart" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
    <filter id="softShadow_golf-cart" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.12" />
    </filter>
    
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="96" fill="url(#bg_golf-cart)" />
  <circle cx="256" cy="256" r="210" fill="url(#glow_golf-cart)" />

    <g filter="url(#shadow_golf_cart)">
      <rect x="140" y="240" width="180" height="60" rx="12" fill="#10B981" />
      <line x1="160" y1="240" x2="160" y2="160" stroke="#475569" stroke-width="8" />
      <line x1="300" y1="240" x2="300" y2="160" stroke="#475569" stroke-width="8" />
      <rect x="140" y="150" width="180" height="14" rx="7" fill="#F8FAFC" />
      <circle cx="180" cy="310" r="25" fill="#1E293B" /><circle cx="280" cy="310" r="25" fill="#1E293B" />
    </g>
  </svg>