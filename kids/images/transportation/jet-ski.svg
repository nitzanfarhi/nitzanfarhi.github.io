<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_jet-ski" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECFEFF" />
      <stop offset="100%" stop-color="#CFFAFE" />
    </linearGradient>
    <radialGradient id="glow_jet-ski" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow_jet-ski" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
    <filter id="softShadow_jet-ski" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.12" />
    </filter>
    
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="96" fill="url(#bg_jet-ski)" />
  <circle cx="256" cy="256" r="210" fill="url(#glow_jet-ski)" />

    <g filter="url(#shadow_jet_ski)">
      <path d="M 120 300 L 170 340 L 390 340 L 410 280 L 280 250 Z" fill="#06B6D4" />
      <path d="M 230 250 L 280 190 L 330 250 Z" fill="#F43F5E" />
    </g>
  </svg>