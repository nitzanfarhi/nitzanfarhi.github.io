<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_ferry" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F9FF" />
      <stop offset="100%" stop-color="#E0F2FE" />
    </linearGradient>
    <radialGradient id="glow_ferry" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow_ferry" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
    <filter id="softShadow_ferry" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.12" />
    </filter>
    
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="96" fill="url(#bg_ferry)" />
  <circle cx="256" cy="256" r="210" fill="url(#glow_ferry)" />

    <g filter="url(#shadow_ferry)">
      <path d="M 80 280 L 120 350 L 392 350 L 432 280 Z" fill="#0284C7" />
      <rect x="140" y="210" width="232" height="70" fill="#FFFFFF" rx="10" />
      <circle cx="200" cy="245" r="12" fill="#38BDF8" /><circle cx="260" cy="245" r="12" fill="#38BDF8" /><circle cx="320" cy="245" r="12" fill="#38BDF8" />
    </g>
  </svg>