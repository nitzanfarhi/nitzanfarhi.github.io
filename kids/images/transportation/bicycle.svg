<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_bicycle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECFDF5" />
      <stop offset="100%" stop-color="#D1FAE5" />
    </linearGradient>
    <radialGradient id="glow_bicycle" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow_bicycle" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
    <filter id="softShadow_bicycle" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.12" />
    </filter>
    
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="96" fill="url(#bg_bicycle)" />
  <circle cx="256" cy="256" r="210" fill="url(#glow_bicycle)" />

    <g filter="url(#shadow_bicycle)">
      <circle cx="150" cy="290" r="50" fill="none" stroke="#1E293B" stroke-width="12" />
      <circle cx="362" cy="290" r="50" fill="none" stroke="#1E293B" stroke-width="12" />
      <polyline points="150,290 230,290 310,210 210,210 150,290" fill="none" stroke="#10B981" stroke-width="12" stroke-linecap="round" />
    </g>
  </svg>