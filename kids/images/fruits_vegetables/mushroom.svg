<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_mushroom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF2F2" />
      <stop offset="100%" stop-color="#FEE2E2" />
    </linearGradient>
    <linearGradient id="cap_grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>
    <linearGradient id="stem_grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="100%" stop-color="#FDE68A" />
    </linearGradient>
    <radialGradient id="glow_mushroom" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow_mushroom" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#7F1D1D" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg_mushroom)" />
  <circle cx="256" cy="256" r="210" fill="url(#glow_mushroom)" />

  <!-- Clean Natural Mushroom (Zero Face / Eyes) -->
  <g filter="url(#shadow_mushroom)">
    <!-- Stem -->
    <path d="M 216 260 C 216 380, 200 400, 230 410 C 245 415, 267 415, 282 410 C 312 400, 296 380, 296 260 Z" fill="url(#stem_grad)" stroke="#D97706" stroke-width="6" stroke-linejoin="round" />
    
    <!-- Cap -->
    <path d="M 120 280 C 120 140, 392 140, 392 280 C 392 300, 370 305, 256 305 C 142 305, 120 300, 120 280 Z" fill="url(#cap_grad)" stroke="#991B1B" stroke-width="6" stroke-linejoin="round" />

    <!-- Cap Under-Lip Shadow -->
    <ellipse cx="256" cy="295" rx="126" ry="12" fill="#991B1B" opacity="0.35" />

    <!-- White Polka Dots -->
    <circle cx="256" cy="180" r="28" fill="#FFFFFF" opacity="0.95" />
    <circle cx="180" cy="225" r="22" fill="#FFFFFF" opacity="0.95" />
    <circle cx="332" cy="225" r="22" fill="#FFFFFF" opacity="0.95" />
    <circle cx="256" cy="255" r="18" fill="#FFFFFF" opacity="0.9" />
    <circle cx="140" cy="265" r="14" fill="#FFFFFF" opacity="0.85" />
    <circle cx="372" cy="265" r="14" fill="#FFFFFF" opacity="0.85" />
  </g>
</svg>