<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_angry" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEFCE8" />
      <stop offset="100%" stop-color="#FEF08A" />
    </linearGradient>
    <radialGradient id="glow_angry" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow_angry" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.18" />
    </filter>
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="96" fill="url(#bg_angry)" />
  <circle cx="256" cy="256" r="210" fill="url(#glow_angry)" />
  <!-- Main Content -->
  
    <g filter="url(#shadow_angry)">
      <!-- Glow & Badge Circle -->
      <circle cx="256" cy="240" r="140" fill="#FFFFFF" opacity="0.9" />
      <circle cx="256" cy="240" r="125" fill="#FEF3C7" opacity="0.4" />
      <!-- Giant Cheerful Emoji -->
      <text x="256" y="295" font-size="140" text-anchor="middle" filter="drop-shadow(0px 8px 12px rgba(0,0,0,0.15))">😡</text>
    </g>
  
</svg>