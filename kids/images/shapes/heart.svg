    <filter id="shadow_heart" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.18" />
    </filter>
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="96" fill="url(#bg_heart)" />
  <circle cx="256" cy="256" r="210" fill="url(#glow_heart)" />
  <!-- Main Content -->
  
    <g filter="url(#shadow_heart)">
      <path d="M 256 390 C 130 280, 100 170, 180 130 C 230 105, 256 160, 256 160 C 256 160, 282 105, 332 130 C 412 170, 382 280, 256 390 Z" fill="#EC4899" />
