<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_oval" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF5FF" />
      <stop offset="100%" stop-color="#F3E8FF" />
    </linearGradient>
    <radialGradient id="glow_oval" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow_oval" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.18" />
    </filter>
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="96" fill="url(#bg_oval)" />
  <circle cx="256" cy="256" r="210" fill="url(#glow_oval)" />
  <!-- Main Content -->
  
    <g filter="url(#shadow_oval)">
      <ellipse cx="256" cy="256" rx="160" ry="110" fill="#06B6D4" />
    </g>
  
</svg>