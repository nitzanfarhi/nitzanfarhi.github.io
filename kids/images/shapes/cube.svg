<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_cube" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF5FF" />
      <stop offset="100%" stop-color="#F3E8FF" />
    </linearGradient>
    <radialGradient id="glow_cube" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow_cube" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.18" />
    </filter>
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="96" fill="url(#bg_cube)" />
  <circle cx="256" cy="256" r="210" fill="url(#glow_cube)" />
  <!-- Main Content -->
  
    <g filter="url(#shadow_cube)">
      
        <polygon points="256,120 376,190 256,260 136,190" fill="#93C5FD" />
        <polygon points="136,190 256,260 256,390 136,320" fill="#3B82F6" />
        <polygon points="376,190 256,260 256,390 376,320" fill="#1D4ED8" />
      
    </g>
  
</svg>