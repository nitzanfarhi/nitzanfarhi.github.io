    <filter id="shadow_trapezoid" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.18" />
    </filter>
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="96" fill="url(#bg_trapezoid)" />
  <circle cx="256" cy="256" r="210" fill="url(#glow_trapezoid)" />
  <!-- Main Content -->
  
    <g filter="url(#shadow_trapezoid)">
