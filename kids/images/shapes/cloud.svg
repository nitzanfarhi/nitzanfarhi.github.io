<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_cloud" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF5FF" />
      <stop offset="100%" stop-color="#F3E8FF" />
    </linearGradient>
    <radialGradient id="glow_cloud" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow_cloud" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.18" />
    </filter>
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="96" fill="url(#bg_cloud)" />
  <circle cx="256" cy="256" r="210" fill="url(#glow_cloud)" />
  <!-- Main Content -->
  
    <g filter="url(#shadow_cloud)">
      <path d="M 170 330 A 60 60 0 0 1 150 215 A 80 80 0 0 1 290 180 A 70 70 0 0 1 370 260 A 55 55 0 0 1 350 330 Z" fill="#38BDF8" />
    </g>
  
</svg>